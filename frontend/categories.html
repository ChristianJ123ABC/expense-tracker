<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>

    <!-- Links for the bootstrap and CSS file-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body id = categories>

    <nav class="navbar bg-info bg-90">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Expense Tracker</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarTogglerDemo02" aria-labelledby="navbarTogglerDemo02Label">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarTogglerDemo02Label">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav me-auto mb-2">
                        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/categories">Categories</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout">Log Out</a></li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <div class = "flash">
        {% for category, message in get_flashed_messages(with_categories = true) %}
            <div class = "alert-{{ category }}"><h2>{{ message }}</h2></div>
        {% endfor %}
    </div>

    <h1>Categories</h1>
    <form method = "POST" action="{{ url_for('categories')}}">
        <input type = "text" name="name" placeholder="Name (e.g. Food for category, Salary for income)" class="form-control" required>
        <select name = "type" class="form-control">
            <option value = "expense">Expense</option>
            <option value = "income">Income</option>
        </select>
        <button>Add Category</button>
    </form>

    <table>
        <tr><th>Name</th><th>Type</th></tr>
        {% for c in categories %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.type }}</td>
            <td>
                <form method="POST" action="/categories/{{ c.id }}/delete">
                    <button>Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    
    

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
