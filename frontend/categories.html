{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block body_id %}Categories{% endblock %}

{% block content %}
   <h1>Categories</h1>
    <form method = "POST" action="{{ url_for('categories')}}">
        <input type = "text" name="name" placeholder="Name (e.g. Food for category, Salary for income)" class="form-control" required>
        <select name = "type" class="form-control">
            <option value = "expense">Expense</option>
            <option value = "income">Income</option>
        </select>
        <button>Add Category</button>
    </form>

    <table>
        <tr><th>Name</th><th>Type</th></tr>
        {% for c in categories %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.type }}</td>
            <td>
                <form method="POST" action="/categories/{{ c.id }}/delete">
                    <button>Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
