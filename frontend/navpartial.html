<!-- NAVBAR: 
  https://getbootstrap.com/docs/6.0/examples/
 https://getbootstrap.com/docs/6.0/components/nav-overflow/
 https://www.w3schools.com/howto/howto_css_topnav_centered.asp
 -->    

<nav class="navbar bg-info bg-90">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">Expense Tracker</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarTogglerDemo02" aria-labelledby="navbarTogglerDemo02Label">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarTogglerDemo02Label">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav me-auto mb-2">
                    {% if session.user_id %}
                        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.endpoint in ('transactions', 'edit_transaction') %}active{% endif %}" href="{{ url_for('transactions') }}">Transactions</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'categories' %}active{% endif %}" href="{{ url_for('categories') }}">Categories</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Log Out</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'register' %}active{% endif %}" href="{{ url_for('register') }}">Register</a></li>
                        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'login' %}active{% endif %}" href="{{ url_for('login') }}">Login</a></li>
                    {% endif %}
                </ul>
            </div>
        </dialog>
    </div>
</nav>
